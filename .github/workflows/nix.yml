name: Nix Flake Check

on:
  push:
    branches:
      - master
      - work
      - codex/*
      - feature/*
  pull_request:
    branches:
      - master
      - work
      - codex/*
      - feature/*
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Run flake check
        # --impure: configuration.nix probes /etc/nixos for machine-local
        # config and reads $CI to allow the testfiles fallback. The runner
        # has no /etc/nixos, so the stub modules in nixos/testfiles are used.
        run: |
          nix flake check --impure
